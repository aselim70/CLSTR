name: Release iOS

# Twee dingen in één workflow, te kiezen met "modus":
#
#   controleren  Bouwt de app onondertekend. Hiervoor is géén Apple-account en
#                geen enkel secret nodig. Dit is de enige manier om vanaf een
#                Windows-machine te merken dat de iOS-build stuk is — bijv.
#                doordat een plugin een nieuwere iOS-versie eist. Draai dit na
#                elke `flutter pub upgrade`.
#
#   release      Bouwt een ondertekende .ipa en zet die klaar als download (of
#                uploadt hem naar App Store Connect / TestFlight). Vereist een
#                betaald Apple Developer Program-lidmaatschap en de secrets
#                hieronder.
#
# Start je altijd met de hand (Actions -> "Release iOS" -> "Run workflow"),
# net als bij Android: een gewone push mag nooit een release veroorzaken.
#
# LET OP — dit draait op een macOS-runner, en die kost 10x zoveel
# GitHub-Actions-minuten als een Linux-runner. Draai dit dus niet bij elke
# push; daar is de gewone CI voor.
#
# EENMALIG IN TE STELLEN voor modus "release" — GitHub -> Settings -> Secrets
# and variables -> Actions:
#
#   IOS_CERTIFICATE_BASE64      je "Apple Distribution"-certificaat als .p12,
#                               base64-gecodeerd. Exporteer het uit Sleutelhanger
#                               (Mac) en codeer met: base64 -i cert.p12 | pbcopy
#   IOS_CERTIFICATE_PASSWORD    het wachtwoord dat je bij die export koos
#   IOS_PROVISIONING_PROFILE_BASE64
#                               het App Store-provisioningprofiel (.mobileprovision)
#                               voor com.clstr.app, base64-gecodeerd
#   IOS_TEAM_ID                 je Team ID (10 tekens), te vinden op
#                               developer.apple.com -> Membership
#
# Optioneel, alleen nodig om automatisch naar TestFlight te uploaden in plaats
# van de .ipa zelf te downloaden. Maak hiervoor een App Store Connect API-sleutel
# (App Store Connect -> Users and Access -> Integrations -> App Store Connect API):
#
#   APPSTORE_API_KEY_ID         de Key ID van die sleutel
#   APPSTORE_API_ISSUER_ID      de Issuer ID (staat op dezelfde pagina)
#   APPSTORE_API_PRIVATE_KEY_BASE64
#                               het .p8-bestand dat je daar één keer kunt
#                               downloaden, base64-gecodeerd
#
# LET OP: de allereerste upload van een app naar App Store Connect moet je met
# de hand doen (via Transporter of Xcode op een Mac). Pas als de app daar
# bestaat, kan de API het overnemen.

on:
  workflow_dispatch:
    inputs:
      modus:
        description: 'Wat moet er gebeuren?'
        type: choice
        default: controleren
        options: [controleren, release]
      versienaam:
        description: 'Versienaam, bijv. 1.1.0 (leeg = uit pubspec.yaml)'
        type: string
        required: false
      uploaden:
        description: 'Naar TestFlight uploaden (alleen bij modus release, met API-secrets)'
        type: boolean
        default: false

env:
  # Waarom een ándere offset dan bij Android (die staat op 100): het
  # runnummer van GitHub Actions telt PER WORKFLOW. Deze workflow begint dus
  # gewoon weer bij 1, terwijl release-android.yml al veel verder is. Met
  # dezelfde offset zouden beide platforms buildnummers uitdelen die toevallig
  # gelijk zijn zonder dat het dezelfde release is — en dan blokkeert
  # `minimumBuild` in Firestore de verkeerde mensen. Met 1000 zie je in één
  # oogopslag of een buildnummer van Android of van iOS komt.
  #
  # Zie ook `minimumBuildIos` in lib/versie_check.dart: dat veld bestaat
  # precies om deze twee tellers uit elkaar te houden.
  BUILD_NUMMER_OFFSET: 1000

  BUNDLE_ID: com.clstr.app

jobs:
  bouwen:
    name: iOS bouwen
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          # Gelijk houden aan ci.yml en release-android.yml.
          flutter-version: 3.44.x
          channel: stable
          cache: true

      - name: Buildnummer bepalen
        id: versie
        run: |
          echo "build=$(( ${{ github.run_number }} + BUILD_NUMMER_OFFSET ))" >> "$GITHUB_OUTPUT"

      - run: flutter pub get

      # Zelfde reden als bij Android: een release start je soms dagen later of
      # vanaf een andere branch dan waarop CI groen was.
      - run: flutter analyze
      - run: flutter test

      # ------------------------------------------------------------------
      # Modus "controleren": alleen bouwen, verder niets.
      # ------------------------------------------------------------------
      - name: Onondertekend bouwen (controle)
        if: inputs.modus == 'controleren'
        env:
          VERSIENAAM: ${{ inputs.versienaam }}
          BUILD_NUMMER: ${{ steps.versie.outputs.build }}
        run: |
          ARGS="--build-number=$BUILD_NUMMER"
          if [ -n "$VERSIENAAM" ]; then
            ARGS="$ARGS --build-name=$VERSIENAAM"
          fi
          flutter build ios --release --no-codesign $ARGS
          echo "::notice::De iOS-build slaagt. Dit bestand is niet ondertekend en kan dus niet naar de App Store."

      # ------------------------------------------------------------------
      # Modus "release": ondertekenen en een .ipa maken.
      # ------------------------------------------------------------------
      - name: Controleren of de secrets er zijn
        if: inputs.modus == 'release'
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          TEAM: ${{ secrets.IOS_TEAM_ID }}
        run: |
          ONTBREEKT=""
          [ -z "$CERT" ] && ONTBREEKT="$ONTBREEKT IOS_CERTIFICATE_BASE64"
          [ -z "$PROFILE" ] && ONTBREEKT="$ONTBREEKT IOS_PROVISIONING_PROFILE_BASE64"
          [ -z "$TEAM" ] && ONTBREEKT="$ONTBREEKT IOS_TEAM_ID"
          if [ -n "$ONTBREEKT" ]; then
            echo "::error::Deze secrets ontbreken:$ONTBREEKT. Zonder die drie kan er niet ondertekend worden. Zie de uitleg bovenaan dit bestand, of draai deze workflow in modus 'controleren'."
            exit 1
          fi

      - name: Certificaat in een tijdelijke sleutelhanger zetten
        if: inputs.modus == 'release'
        env:
          CERT_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          # Een eigen sleutelhanger en niet de standaard "login": die is op een
          # runner met een wachtwoord vergrendeld dat we niet kennen, en na de
          # run gooit GitHub de hele machine toch weg.
          KEYCHAIN="$RUNNER_TEMP/clstr.keychain-db"
          KEYCHAIN_PW=$(uuidgen)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          echo "$CERT_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Zonder deze regel vraagt codesign halverwege de build om
          # toestemming — en op een runner is er niemand die klikt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Provisioningprofiel installeren
        if: inputs.modus == 'release'
        id: profiel
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          MAP="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$MAP"
          echo "$PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/profiel.mobileprovision"

          # Een .mobileprovision is een ondertekend CMS-bericht met daarin een
          # plist. Xcode wil het bestand op naam van de UUID, en de
          # exportinstellingen verderop hebben de profielnaam nodig.
          security cms -D -i "$RUNNER_TEMP/profiel.mobileprovision" > "$RUNNER_TEMP/profiel.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$RUNNER_TEMP/profiel.plist")
          NAAM=$(/usr/libexec/PlistBuddy -c "Print :Name" "$RUNNER_TEMP/profiel.plist")
          cp "$RUNNER_TEMP/profiel.mobileprovision" "$MAP/$UUID.mobileprovision"

          echo "naam=$NAAM" >> "$GITHUB_OUTPUT"
          echo "::notice::Profiel geïnstalleerd: $NAAM ($UUID)"

      - name: Flutter-deel bouwen
        if: inputs.modus == 'release'
        env:
          VERSIENAAM: ${{ inputs.versienaam }}
          BUILD_NUMMER: ${{ steps.versie.outputs.build }}
        run: |
          # Eerst onondertekend: dit zet de Dart-code, de assets en
          # Generated.xcconfig klaar. Het ondertekenen doet xcodebuild
          # hieronder, zodat we de signeerinstellingen op de opdrachtregel
          # kunnen meegeven in plaats van ze in project.pbxproj te zetten —
          # anders zou lokaal bouwen op een Mac stukgaan.
          ARGS="--build-number=$BUILD_NUMMER"
          if [ -n "$VERSIENAAM" ]; then
            ARGS="$ARGS --build-name=$VERSIENAAM"
          fi
          flutter build ios --release --no-codesign $ARGS

      - name: Archiveren en exporteren
        if: inputs.modus == 'release'
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          PROFIEL_NAAM: ${{ steps.profiel.outputs.naam }}
        run: |
          set -eo pipefail

          xcodebuild archive \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFIEL_NAAM" \
            CODE_SIGN_IDENTITY="Apple Distribution"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>$TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$PROFIEL_NAAM</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/ipa"

          ls -l "$RUNNER_TEMP/ipa"

      - name: Controleren dat er echt een ondertekende .ipa ligt
        if: inputs.modus == 'release'
        run: |
          IPA=$(ls "$RUNNER_TEMP"/ipa/*.ipa 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then
            echo "::error::Er is geen .ipa gemaakt. Kijk in het log van de exportstap hierboven."
            exit 1
          fi
          echo "IPA=$IPA" >> "$GITHUB_ENV"

      - name: IPA als download klaarzetten
        if: inputs.modus == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: clstr-${{ steps.versie.outputs.build }}-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30

      - name: Uploaden naar App Store Connect
        if: inputs.modus == 'release' && inputs.uploaden
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_API_ISSUER_ID }}
          PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_API_PRIVATE_KEY_BASE64 }}
        run: |
          if [ -z "$KEY_ID" ] || [ -z "$ISSUER_ID" ] || [ -z "$PRIVATE_KEY_BASE64" ]; then
            echo "::error::Uploaden is aangevinkt, maar APPSTORE_API_KEY_ID / APPSTORE_API_ISSUER_ID / APPSTORE_API_PRIVATE_KEY_BASE64 zijn niet alledrie ingesteld. De .ipa staat wel als artefact klaar om zelf te uploaden."
            exit 1
          fi
          # altool zoekt de sleutel zelf op deze vaste plek, op naam van de Key ID.
          mkdir -p "$HOME/private_keys"
          echo "$PRIVATE_KEY_BASE64" | base64 -d > "$HOME/private_keys/AuthKey_$KEY_ID.p8"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          rm -f "$HOME/private_keys/AuthKey_$KEY_ID.p8"

      - name: Sleutelhanger opruimen
        # Ook als de build hierboven is mislukt: laat geen ontgrendelde
        # sleutelhanger met een distributiecertificaat achter.
        if: always() && inputs.modus == 'release'
        run: |
          if [ -n "$KEYCHAIN" ] && [ -f "$KEYCHAIN" ]; then
            security delete-keychain "$KEYCHAIN" || true
          fi

      - name: Onthouden welk buildnummer dit was
        if: inputs.modus == 'release'
        run: |
          echo "### iOS-release gebouwd" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Buildnummer (CFBundleVersion): **${{ steps.versie.outputs.build }}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Wil je oudere iOS-versies blokkeren? Zet \`minimumBuildIos\` in Firestore (\`app_config/versie\`) op **${{ steps.versie.outputs.build }}** zodra deze release bij iedereen binnen is. Let op: \`minimumBuildIos\`, niet \`minimumBuild\` — dat laatste hoort bij de Android-teller." >> "$GITHUB_STEP_SUMMARY"
